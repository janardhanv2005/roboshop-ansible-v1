- name: Configure catalogue
  hosts: catalogue
  become: true
  tasks:
    - name: enable nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      package:
        name: nodejs
        state: present

    - name: add user
      user:
        name: roboshop
        comment: roboshop system user
        system: true
        create_home: false
        home: /app
        shell: /sbin/nologin

    - name: remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove existing catalogue.zip
      file: 
        path: /tmp/catalogue.zip
        state: absent

    - name: make directory
      file:
        path: /app
        state: directory

    - name: download git repo
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
        dest: /tmp/catalogue.zip

    - name: unzip archive
      unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes

    - name: Install npm dependencies
      community.general.npm:
        path: /app

    - name: copy catalogue service
      template:
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service

    - name: copy mongo db repo file
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: install mongodb client
      dnf:
        name: mongodb-mongosh
        state: present
    - name: check products loaded or not
      command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count

    - name: print product_count
      debug:
        msg: "{{ product_count }}"

    - name: load products
      command: mongosh --host {{mongodb_host}} </app/db/master-data.js
      when: product_count.stdout | int == 0
    
    - name: daemon reload
      systemd_service:
        daemon_reload: true
    
    - name: start and enable catalogue
      service:
        name: catalogue
        state: restarted
        enabled: yes


    

    
