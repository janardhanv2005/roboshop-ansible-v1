- name: create roboshop ec2 and route53 record
  hosts: local
  connection: local
  vars:
    instances: ["mysql"]
    image_id: ami-0c55b159cbfafe1f0
    instance_type: t2.micro
    security_group: "roboshop-common"
    region_name: us-east-1
    hosted_zone: mithul.space
    action: create
  tasks:
  - name: Launch EC2 instance
    ec2:
      key_name: "{{ key_name }}"
      group: "{{ security_group }}"
      instance_type: "{{ instance_type }}"
      image: "{{ image_id }}"
      wait: yes
      region: "{{ region_name }}"
      count: 1
      instance_tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    when: action == 'create'

  - name: update route53 record
    route53:
      state: present
      zone: "{{ hosted_zone }}"
      record: "{{ item }}.{{ hosted_zone }}"
      type: A
      ttl: 300
      value: "{{ ec2.instances[0].public_ip }}"
      overwrite: yes
    loop: "{{ instances }}"
    when: action == 'create'

  - name: remove route53 record
    route53:
      state: absent
      zone: "{{ hosted_zone }}"
      record: "{{ item }}.{{ hosted_zone }}"
    loop: "{{ instances }}"
    when: action == 'delete'

  - name: terminate EC2 instance
    ec2:
      state: absent
      region: "{{ region_name }}"
      instance_ids: "{{ ec2.instances[0].id }}"
    loop: "{{ instances }}"
    when: action == 'delete'