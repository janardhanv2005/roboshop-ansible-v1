- name: Configure Payment
  hosts: Payment
  become: true
  tasks:
    - name: install Python and Pip
      dnf:
        name: 
        - python3.14
        - python3.14-pip
        state: present

    - name: add user
      user:
        name: roboshop
        comment: roboshop system user
        system: true
        create_home: false
        home: /app
        shell: /sbin/nologin

    - name: Remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove existing payement zip
      file:
        path: /tmp/payment.zip
        state: absent

    - name: make directory app
      file:
        path: /app
        state: directory

    - name: download application 
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-{{ app_version }}.zip
        dest: /tmp/payment.zip
    
    - name: unarchive cart zip
      unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: Create Python virtual environment
      command:
        cmd: python3.14 -m venv /app/.venv
        creates: /app/.venv/bin/python

    - name: Install Python dependencies
      pip:
        requirements: /app/requirements.txt
        virtualenv: /app/.venv

    - name: daemon reload
      systemd_service:
        daemon_reload: true
    
    - name: start and enable payment
      service:
        name: payment
        state: restarted
        enabled: yes

