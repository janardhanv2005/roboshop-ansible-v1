- name: Configure Frontend
  hosts: frontend
  become: true

  tasks:
    - name: Enable Nginx 1.26 module
      ansible.builtin.command:
        cmd: dnf -y module enable nginx:1.26
      register: nginx_module
      changed_when: "'Complete!' in nginx_module.stdout"

    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true