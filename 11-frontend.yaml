- name: Configure Frontend
  hosts: frontend
  become: true
  tasks:
    - name: disable nginx 
      command: dnf module disable nginx -y

    - name: enable nginx 1.26
      command: dnf module enable nginx:1.26 -y

    - name: install nginx
      package:
        name: nginx
        state: present
    - name: start nginx and enable
      service:
        name: nginx
        state: restarted
        enabled: yes     