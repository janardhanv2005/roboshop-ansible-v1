- name: Configure User
  hosts: user
  become: true
  tasks:
    - name: enable nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      package:
        name: nodejs
        state: present

    - name: add user
      user:
        name: roboshop
        comment: roboshop system user
        system: true
        create_home: false
        home: /app
        shell: /sbin/nologin

    - name: Remove existing app directory
      file:
        path: /app
        state: absent

    - name: remove existing user zip
      file:
        path: /tmp/user.zip
        state: absent

    - name: make directory app
      file:
        path: /app
        state: present

    - name: download application 
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
        dest: /tmp/user.zip
    
    - name: unarchive user zip
      unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

    - name: Install dependencies
      community.general.npm:
        path: /app
        
    - name: copy user service
      template:
        src: user.service.j2
        dest: /etc/systemd/system/user.service

    - name: daemon reload
      systemd_service:
        daemon_reload: true

    - name: start and enable user
      service:
        name: user
        state: restarted
        enabled: yes



